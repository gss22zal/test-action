name: Docker Build & Deploy

on:
  push:
    branches: [ "main" ]  # Укажите вашу основную ветку
  workflow_dispatch:      # Позволяет запускать вручную из вкладки Actions

jobs:
  # ------------------- ДЖОБА 1: Сборка и публикация -------------------
  build-and-push:
    name: Сборка и push в GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Обязательно для записи в GitHub Container Registry

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Логин в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и отправка образа
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # В GHCR имя репозитория автоматически приводится к нижнему регистру
          tags: ghcr.io/${{ github.repository }}:latest

  # ------------------- ДЖОБА 2: Деплой через SSH -------------------
  deploy-to-server:
    name: Развертывание на сервере
    needs: build-and-push  # Запускается только после успешной сборки
    runs-on: ubuntu-latest

    steps:
      - name: Подключение по SSH и запуск контейнера
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # 1. Скачиваем свежий образ из GHCR
            docker pull ghcr.io/${{ github.repository }}:latest

            # 2. Останавливаем и удаляем старый контейнер (|| true чтобы не падать, если его нет)
            docker stop myapp || true
            docker rm myapp || true

            # 3. Запускаем новый контейнер
            docker run -d \
              --name myapp \
              --restart unless-stopped \
              -p 8081:80 \
              ghcr.io/${{ github.repository }}:latest